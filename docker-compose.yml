# 本地开发用 PostgreSQL + pgvector
# 启动：docker compose up -d
# 连接串与 server/.env.example 中 DATABASE_URL 默认值一致

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-knowledge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_knowledge
    ports:
      - '5432:5432'
    volumes:
      - ai_knowledge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_knowledge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_knowledge_pgdata:
